name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
      - name: The command runs
        run: |
          node dist/src/cli.js --version
          node dist/src/cli.js help
      - name: The installed command runs (as people will run it)
        shell: bash
        run: |
          npm install -g .
          test "$(dosely --version)" = "dosely 0.1.0"
          export DOSELY_FILE="$RUNNER_TEMP/dosely.json"
          dosely init --zone UTC
          dosely add Test --schedule "daily 8am"
          dosely list | grep -q "once a day: 1 tablet at 08:00"
